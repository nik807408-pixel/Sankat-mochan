<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f2547">
<title>Sankat Mochan — ग्राहक पासबुक</title>
<link rel="icon" href="icon-192.png"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{--navy:#0f2547;--navy2:#1a3a6b;--gold:#fbbf24;--bg:#f1f5f9;--text:#1a1a1a;--muted:#64748b;--border:#e2e8f0;--success:#16a34a;--danger:#dc2626}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  .wrap{max-width:480px;margin:0 auto;padding:0 0 40px}

  /* Login */
  #login-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,#0a0a0a,#1f1f1f)}
  #login-screen img{width:130px;height:auto;margin-bottom:18px}
  .login-card{background:white;border-radius:20px;padding:26px 22px;width:100%;max-width:380px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
  .login-card h1{font-size:18px;color:var(--navy);text-align:center;margin-bottom:4px}
  .login-card .sub{font-size:12px;color:var(--muted);text-align:center;margin-bottom:20px}
  .login-card label{font-size:12px;font-weight:600;color:var(--navy);display:block;margin-bottom:5px}
  .login-card input{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;font-size:15px;margin-bottom:14px}
  .login-card input:focus{outline:none;border-color:var(--navy)}
  .login-btn{width:100%;background:linear-gradient(135deg,var(--navy),var(--navy2));color:white;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:700;cursor:pointer}
  .login-err{background:#fef2f2;color:var(--danger);font-size:12.5px;padding:10px 12px;border-radius:8px;margin-bottom:12px;display:none}

  /* Topbar */
  .topbar{background:linear-gradient(135deg,var(--navy),var(--navy2));color:white;padding:14px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
  .topbar img{width:36px;height:36px;border-radius:8px;object-fit:cover}
  .topbar .t-name{font-size:16px;font-weight:700}
  .topbar .t-sub{font-size:10px;opacity:.85}
  .logout-btn{margin-left:auto;background:rgba(255,255,255,.15);border:none;color:white;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer}

  .card{background:white;border-radius:16px;padding:16px;margin:14px;box-shadow:0 2px 10px rgba(15,37,71,.07)}
  .hello{background:linear-gradient(135deg,var(--navy),var(--navy2));color:white}
  .hello .nm{font-size:20px;font-weight:800}
  .hello .meta{font-size:12px;opacity:.9;margin-top:3px}

  .overdue-alert{background:#fef2f2;border:1.5px solid #fca5a5;border-radius:12px;padding:14px;margin:14px;display:flex;gap:10px;align-items:flex-start}
  .overdue-alert .ic{font-size:22px}
  .overdue-alert .ttl{font-weight:800;color:var(--danger);font-size:14px}
  .overdue-alert .txt{font-size:12.5px;color:#7f1d1d;margin-top:2px}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px}
  .stat{background:white;border-radius:14px;padding:14px;box-shadow:0 2px 8px rgba(15,37,71,.06);border-left:4px solid var(--navy)}
  .stat .lbl{font-size:11px;color:var(--muted)}
  .stat .val{font-size:19px;font-weight:800;color:var(--navy);margin-top:3px}
  .stat.green{border-left-color:var(--success)} .stat.green .val{color:var(--success)}
  .stat.red{border-left-color:var(--danger)} .stat.red .val{color:var(--danger)}
  .stat.gold{border-left-color:var(--gold)} .stat.gold .val{color:#b45309}

  .sec-title{font-size:14px;font-weight:800;color:var(--navy);margin:18px 14px 8px}
  .pay-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border)}
  .pay-row:last-child{border-bottom:none}
  .pay-row .pd{font-size:12px;color:var(--muted)}
  .pay-row .pa{font-weight:700;color:var(--success);font-size:15px}
  .det-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
  .det-row:last-child{border-bottom:none}
  .det-row .k{color:var(--muted)} .det-row .v{font-weight:700;color:var(--navy)}
  .progress-bar{height:10px;background:var(--border);border-radius:6px;overflow:hidden;margin-top:8px}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--navy),var(--success))}
  .foot{text-align:center;font-size:11px;color:var(--muted);margin-top:24px;padding:0 20px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <img src="icon-192.svg" alt="Sankat Mochan" onerror="this.style.display='none'"/>
  <div class="login-card">
    <h1>ग्राहक पासबुक</h1>
    <div class="sub">Customer Passbook — अपनी जानकारी देखें</div>
    <div class="login-err" id="login-err"></div>
    <label>Customer ID / ग्राहक आईडी</label>
    <input id="in-cust" placeholder="CUS-..." autocomplete="off"/>
    <label>Loan ID / लोन आईडी</label>
    <input id="in-loan" placeholder="LOAN-..." autocomplete="off"/>
    <button class="login-btn" id="login-btn" onclick="doLogin()">देखें / View Passbook</button>
  </div>
  <div style="color:rgba(255,255,255,.5);font-size:11px;margin-top:18px;text-align:center">Sankat Mochan Finance</div>
</div>

<!-- DASHBOARD -->
<div id="app" class="wrap" style="display:none">
  <div class="topbar">
    <img src="icon-192.svg" alt="" onerror="this.style.display='none'"/>
    <div>
      <div class="t-name">Sankat Mochan</div>
      <div class="t-sub">ग्राहक पासबुक</div>
    </div>
    <button class="logout-btn" onclick="logout()">बाहर</button>
  </div>
  <div id="content"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://chaenhnaslkmzutmsumi.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNoYWVuaG5hc2xrbXp1dG1zdW1pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMzA2MjcsImV4cCI6MjA5MzYwNjYyN30.X-f-HPQzFMu7DivRZJz9y0Zx2DMjlh3trN66MWAhU1g';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const fmt = n => (parseFloat(n)||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});

async function doLogin(){
  const cust = document.getElementById('in-cust').value.trim();
  const loan = document.getElementById('in-loan').value.trim();
  const err = document.getElementById('login-err');
  const btn = document.getElementById('login-btn');
  err.style.display='none';
  if(!cust || !loan){ err.textContent='Customer ID aur Loan ID dono daalein'; err.style.display='block'; return; }
  btn.disabled=true; btn.textContent='देख रहे हैं...';
  try{
    const { data, error } = await db.rpc('get_customer_passbook', { p_customer_id: cust, p_loan_id: loan });
    if(error) throw error;
    if(!data || !data.found){
      err.textContent='❌ Galat Customer ID ya Loan ID. Kripya sahi daalein.';
      err.style.display='block';
      btn.disabled=false; btn.textContent='देखें / View Passbook';
      return;
    }
    render(data);
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').style.display='block';
    window.scrollTo(0,0);
  }catch(e){
    err.textContent='Error: '+(e.message||'kuch galat hua'); err.style.display='block';
    btn.disabled=false; btn.textContent='देखें / View Passbook';
  }
}

function logout(){
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('in-cust').value='';
  document.getElementById('in-loan').value='';
  const btn=document.getElementById('login-btn'); btn.disabled=false; btn.textContent='देखें / View Passbook';
}

function render(d){
  const payments = (d.payments||[]).filter(p=>p.type==='credit');
  const loanAmt = parseFloat(d.loan_amount)||0;
  const interest = parseFloat(d.interest_amount)||0;
  const total = loanAmt + interest;
  const balance = parseFloat(d.balance)||0;
  const paid = total - balance;
  const paidPct = total>0 ? Math.min(100, Math.round((paid/total)*100)) : 0;
  const weeks = parseInt(d.loan_weeks)||12;
  const emi = total>0 ? Math.round(total/weeks) : 0;

  // Next due + overdue
  let nextDue='', isOverdue=false;
  if(balance>0){
    const lastPay = payments[0];
    let base = lastPay && lastPay.date ? new Date(lastPay.date) : (d.loan_date? new Date(d.loan_date): new Date());
    base.setDate(base.getDate()+7); // weekly
    nextDue = base.toISOString().slice(0,10);
    isOverdue = new Date(nextDue) < new Date(new Date().toDateString());
  }

  let html = `
    <div class="card hello">
      <div class="nm">नमस्ते, ${d.name||'ग्राहक'} 👋</div>
      <div class="meta">Loan ID: ${d.loan_id||'-'} · ${d.center_name||''}</div>
    </div>`;

  if(isOverdue){
    html += `<div class="overdue-alert">
      <div class="ic">⚠️</div>
      <div>
        <div class="ttl">किस्त बाकी है / Payment Due</div>
        <div class="txt">आपकी किस्त की तारीख निकल गई है (${nextDue}). कृपया जल्द भुगतान करें। बकाया: ₹${fmt(balance)}</div>
      </div>
    </div>`;
  } else if(nextDue){
    html += `<div class="overdue-alert" style="background:#fffbeb;border-color:#fcd34d">
      <div class="ic">📅</div>
      <div>
        <div class="ttl" style="color:#b45309">अगली किस्त / Next EMI</div>
        <div class="txt" style="color:#854d0e">तारीख: ${nextDue} · राशि: ₹${fmt(emi)}</div>
      </div>
    </div>`;
  }

  html += `
    <div class="grid">
      <div class="stat"><div class="lbl">कुल लोन / Total Loan</div><div class="val">₹${fmt(total)}</div></div>
      <div class="stat green"><div class="lbl">जमा / Paid</div><div class="val">₹${fmt(paid)}</div></div>
      <div class="stat red"><div class="lbl">बाकी / Balance</div><div class="val">₹${fmt(balance)}</div></div>
      <div class="stat gold"><div class="lbl">साप्ताहिक EMI</div><div class="val">₹${fmt(emi)}</div></div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;font-size:12px"><span style="color:var(--muted)">Progress</span><span style="font-weight:700;color:var(--navy)">${paidPct}% पूरा</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${paidPct}%"></div></div>
    </div>`;

  // Loan details
  html += `<div class="sec-title">📋 लोन विवरण / Loan Details</div>
    <div class="card">
      <div class="det-row"><span class="k">Customer ID</span><span class="v">${d.customer_id||'-'}</span></div>
      <div class="det-row"><span class="k">Loan ID</span><span class="v">${d.loan_id||'-'}</span></div>
      <div class="det-row"><span class="k">लोन राशि / Principal</span><span class="v">₹${fmt(loanAmt)}</span></div>
      <div class="det-row"><span class="k">ब्याज / Interest</span><span class="v">₹${fmt(interest)}</span></div>
      <div class="det-row"><span class="k">कुल हफ्ते / Weeks</span><span class="v">${weeks}</span></div>
      <div class="det-row"><span class="k">सेंटर / Center</span><span class="v">${d.center_name||'-'}</span></div>
      ${d.loan_date?`<div class="det-row"><span class="k">लोन तारीख</span><span class="v">${d.loan_date}</span></div>`:''}
    </div>`;

  // Payment history (passbook)
  html += `<div class="sec-title">📔 पासबुक / Payment History (${payments.length})</div>
    <div class="card">`;
  if(payments.length){
    let running = 0;
    // show oldest first for passbook feel? keep latest first
    html += payments.map(p=>`
      <div class="pay-row">
        <div>
          <div style="font-weight:600;font-size:13px">✅ ${p.description||'Cash'}</div>
          <div class="pd">${p.date||''}</div>
        </div>
        <div class="pa">+₹${fmt(p.amount)}</div>
      </div>`).join('');
  } else {
    html += `<div style="text-align:center;color:var(--muted);font-size:13px;padding:14px">अभी तक कोई भुगतान नहीं / No payments yet</div>`;
  }
  html += `</div>`;

  html += `<div class="foot">यह आपकी पासबुक है — केवल देखने के लिए।<br>किसी भी सहायता के लिए अपने Sankat Mochan एजेंट से संपर्क करें।<br><br>Sankat Mochan Finance</div>`;

  document.getElementById('content').innerHTML = html;
}

// Enter key submit
document.getElementById('in-loan').addEventListener('keypress', e=>{ if(e.key==='Enter') doLogin(); });
</script>
</body>
</html>
